
<div class="login-container">
  <div class="login-card">

    <h1>Welcome Back!</h1>
    <p class="subtitle">Login to your Personal Expense Tracker</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        />

        <small
          class="validation"
          *ngIf="loginForm.get('email')?.touched &&
                 loginForm.get('email')?.hasError('required')">
          Email is required.
        </small>

        <small
          class="validation"
          *ngIf="loginForm.get('email')?.touched &&
                 loginForm.get('email')?.hasError('email')">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
        />

        <small
          class="validation"
          *ngIf="loginForm.get('password')?.touched &&
                 loginForm.get('password')?.hasError('required')">
          Password is required.
        </small>
      </div>

      <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Register here</a>
    </p>

  </div>
</div>
