
<div class="profile-container">

  <div class="profile-card">

    <h1>My Profile</h1>
    <p class="subtitle">View and manage your personal information</p>

    <div *ngIf="isLoading" class="loading">
      Loading profile...
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <div *ngIf="profile && !isLoading">

      <form [formGroup]="profileForm">

        <div class="form-group">
          <label>Full Name</label>

          <input
            type="text"
            formControlName="fullName"
            [readonly]="!isEditing"
          />

          <small
            class="validation"
            *ngIf="isEditing &&
                   profileForm.get('fullName')?.touched &&
                   profileForm.get('fullName')?.invalid">
            Please enter a valid name with at least 2 characters.
          </small>
        </div>

        <div class="form-group">
          <label>Email Address</label>

          <input
            type="email"
            [value]="profile.email"
            readonly
          />
        </div>

        <div class="form-group">
          <label>Phone Number</label>

          <input
            type="tel"
            formControlName="phoneNumber"
            placeholder="Enter your phone number"
            [readonly]="!isEditing"
          />
        </div>

        <div class="button-group" *ngIf="!isEditing">
          <button type="button" (click)="enableEdit()">
            Edit Profile
          </button>
        </div>

        <div class="button-group" *ngIf="isEditing">

          <button
            type="button"
            (click)="updateProfile()"
            [disabled]="isLoading">
            {{ isLoading ? 'Saving...' : 'Save Changes' }}
          </button>

          <button
            type="button"
            class="cancel-button"
            (click)="cancelEdit()">
            Cancel
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
